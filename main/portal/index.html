<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Road Hog Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           padding: 1.25rem; background: #141815; color: #f2f3eb;
           font: 1rem/1.6 system-ui, sans-serif }
    main { width: min(100%, 34rem); padding: clamp(1.5rem, 6vw, 3rem);
           background: #212622; border: 1px solid #3c473c;
           border-top: .25rem solid #cfed87; border-radius: .75rem }
    h1 { margin: 0 0 1.5rem; font-size: clamp(2rem, 9vw, 3.25rem);
         line-height: 1.05; letter-spacing: -.045em }
    h2 { margin: 1.5rem 0 .25rem; font-size: 1rem; color: #cfed87 }
    p { margin: .25rem 0; color: #d0d8cb }
  </style>
</head>
<body>
  <main>
    <h1>Road Hog Setup</h1>
    <p>You’re connected directly to the Road Hog device.</p>
    <h2>Settings</h2>
    <p>Settings are unavailable in this firmware version.</p>
  </main>
</body>
</html>
